<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments — Tech Titan, CGC Landran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (shared live data store — see firebase-config.js) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg:#02040a; --panel:#0a0f1e; --panel-2:#0e1526;
    --blue:#3d7fff; --amber:#ffb020; --mint:#5eead4;
    --ink:#eef2ff; --slate:#7783a1; --line:rgba(120,150,255,0.16);
    --mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  .hexfield{position:fixed;inset:0;z-index:-3;
    background:radial-gradient(ellipse 80% 60% at 15% 0%, rgba(61,127,255,0.14), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 20%, rgba(94,234,212,0.08), transparent 60%), var(--bg);
  }

  .nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(20px,4vw,56px);background:rgba(2,4,10,0.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);gap:12px;}
  .nav-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .nav-brand img{width:30px;height:30px;object-fit:contain;background:#fff;padding:2px;flex-shrink:0;}
  .nav-brand .tt-mark{background:none;padding:0;}
  .nav-brand-text{display:flex;flex-direction:column;line-height:1.2;}
  .nav-brand-text b{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
  .nav-brand-text span{font-family:var(--mono);font-size:9.5px;color:var(--slate);letter-spacing:.04em;}
  .nav-links{display:flex;gap:28px;font-family:var(--mono);font-size:12px;letter-spacing:0.04em;color:var(--slate);}
  .nav-links a:hover{color:var(--ink);}
  .nav-burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:transparent;border:1px solid var(--line);flex-shrink:0;}
  .nav-burger span{display:block;width:16px;height:1.5px;background:var(--ink);margin:0 auto;}

  .page-head{padding:64px clamp(24px,5vw,72px) 40px;border-bottom:1px solid var(--line);}
  .panel-ref{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:0.06em;margin-bottom:10px;}
  .page-head h1{font-size:clamp(2rem,4.5vw,3rem);font-weight:700;}
  .page-head p{color:var(--slate);margin-top:14px;max-width:560px;font-size:14.5px;line-height:1.6;}

  .wrap{padding:56px clamp(24px,5vw,72px) 100px;}

  .dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-bottom:20px;}
  .dept-card{border:1px solid var(--line);background:var(--panel);padding:24px;cursor:pointer;transition:border-color .2s, transform .2s;}
  .dept-card:hover{border-color:var(--blue);transform:translateY(-3px);}
  .dept-card.active{border-color:var(--mint);}
  .dept-tag{font-family:var(--mono);font-size:10.5px;color:var(--mint);letter-spacing:0.05em;margin-bottom:8px;}
  .dept-card h3{font-size:1.15rem;font-weight:600;margin-bottom:6px;}
  .dept-card span{font-family:var(--mono);font-size:11.5px;color:var(--slate);}

  .students-panel{margin-top:36px;}
  .students-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .students-head h2{font-size:1.5rem;font-weight:600;}
  .students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}

  .id-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel-2),var(--panel));overflow:hidden;transition:transform .2s, border-color .2s;}
  .id-card:hover{transform:translateY(-3px);border-color:var(--blue);}
  .id-card-top{background:linear-gradient(90deg,var(--blue),var(--mint));height:6px;}
  .id-photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .id-photo.placeholder{display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--slate);font-size:28px;}
  .id-body{padding:16px 18px;}
  .id-name{font-size:1.02rem;font-weight:600;margin-bottom:6px;}
  .id-meta{font-family:var(--mono);font-size:11px;color:var(--slate);line-height:1.9;}
  .id-meta b{color:var(--ink);}
  .id-badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:0.05em;color:var(--amber);border:1px solid var(--line);padding:2px 8px;margin-bottom:10px;}

  .empty-state{border:1px dashed var(--line);padding:50px 24px;text-align:center;color:var(--slate);font-family:var(--mono);font-size:13px;line-height:1.8;}
  .empty-state a{color:var(--mint);text-decoration:underline;}

  footer{border-top:1px solid var(--line);padding:24px clamp(24px,5vw,72px);text-align:center;font-family:var(--mono);font-size:11px;color:var(--slate);}

  .mobile-menu{display:none;position:fixed;top:0;right:0;bottom:0;width:min(78vw,300px);z-index:70;
    background:rgba(4,7,16,0.98);backdrop-filter:blur(10px);border-left:1px solid var(--line);
    padding:90px 28px 28px;flex-direction:column;gap:4px;transform:translateX(100%);transition:transform .3s ease;}
  .mobile-menu.open{display:flex;transform:translateX(0);}
  .mobile-menu a{font-family:var(--mono);font-size:14px;letter-spacing:.03em;color:var(--ink);padding:14px 0;border-bottom:1px solid var(--line);}
  .mobile-menu-backdrop{display:none;position:fixed;inset:0;z-index:65;background:rgba(2,4,10,0.6);}
  .mobile-menu-backdrop.open{display:block;}

  @media(max-width:700px){
    .nav-links{display:none;}
    .nav-burger{display:flex;}
    .nav-brand-text span{display:none;}
    .page-head{padding:48px 20px 32px;}
    .wrap{padding:40px 20px 72px;}
  }
  @media(max-width:560px){ .nav-brand-text{display:none;} }
</style>
</head>
<body>

<div class="hexfield"></div>

<nav class="nav">
  <a href="index.html" class="nav-brand">
    <img src="logo.png" alt="CGC Landran logo">
    <img class="tt-mark" src="tech-titan-logo.png" alt="Tech Titan logo" style="width:26px;height:26px;">
    <span class="nav-brand-text"><b>TECH TITAN</b><span>CGC LANDRAN</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="index.html#events">EVENTS</a>
  </div>
  <button class="nav-burger" id="navBurger" aria-label="Open menu"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-menu-backdrop" id="mobileBackdrop"></div>
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">HOME</a>
  <a href="index.html#events">EVENTS</a>
  <a href="index.html#gallery">CAMPUS</a>
</div>

<div class="page-head">
  <div class="panel-ref">MODULE // DEPARTMENTS</div>
  <h1>Tech Titan members, by department</h1>
  <p>Browse the club roster organized by department. Select a department below to see its members' ID cards.</p>
</div>

<div class="wrap">
  <div id="deptGrid" class="dept-grid"></div>
  <div id="studentsPanel" class="students-panel"></div>
</div>

<footer>© 2026 TECH TITAN · CGC LANDRAN</footer>

<script>
let liveDepartments = [];
let activeDeptId = null;

if(window.techtitanDb){
  techtitanDb.collection('departments').onSnapshot((snap)=>{
    liveDepartments = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, (err)=>{
    console.error('Live data unavailable:', err);
    render();
  });
}

function render(){
  const data = liveDepartments;
  const grid = document.getElementById('deptGrid');
  const panel = document.getElementById('studentsPanel');

  if(!data.length){
    grid.innerHTML = '';
    panel.innerHTML = `<div class="empty-state">No departments yet.<br>Head to the <a href="admin.html">admin panel</a> to add departments and students.</div>`;
    return;
  }

  if(!activeDeptId) activeDeptId = data[0].id;

  grid.innerHTML = data.map(d => `
    <div class="dept-card ${d.id===activeDeptId?'active':''}" onclick="selectDept('${d.id}')">
      <div class="dept-tag">DEPARTMENT</div>
      <h3>${escapeHtml(d.name)}</h3>
      <span>${d.students.length} member${d.students.length===1?'':'s'}</span>
    </div>
  `).join('');

  const dept = data.find(d => d.id === activeDeptId) || data[0];
  renderStudents(dept);
}

function renderStudents(dept){
  const panel = document.getElementById('studentsPanel');
  if(!dept){ panel.innerHTML=''; return; }
  if(!dept.students.length){
    panel.innerHTML = `
      <div class="students-head"><h2>${escapeHtml(dept.name)}</h2></div>
      <div class="empty-state">No students added to this department yet.</div>`;
    return;
  }
  panel.innerHTML = `
    <div class="students-head"><h2>${escapeHtml(dept.name)}</h2><span style="font-family:var(--mono);font-size:11.5px;color:var(--slate)">${dept.students.length} member${dept.students.length===1?'':'s'}</span></div>
    <div class="students-grid">
      ${dept.students.map(s => `
        <div class="id-card">
          <div class="id-card-top"></div>
          ${s.photo
            ? `<img class="id-photo" src="${s.photo}" alt="${escapeHtml(s.name)}">`
            : `<div class="id-photo placeholder">👤</div>`}
          <div class="id-body">
            <div class="id-badge">MEMBER ID</div>
            <div class="id-name">${escapeHtml(s.name)}</div>
            <div class="id-meta">
              <div><b>Year:</b> ${escapeHtml(s.year)}</div>
              <div><b>Contact:</b> ${escapeHtml(s.contact)}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function selectDept(id){
  activeDeptId = id;
  render();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null ? '' : str;
  return d.innerHTML;
}

if(!window.techtitanDb) render();

/* ---- mobile menu ---- */
const navBurger = document.getElementById('navBurger');
const mobileMenu = document.getElementById('mobileMenu');
const mobileBackdrop = document.getElementById('mobileBackdrop');
function closeMobileMenu(){ mobileMenu.classList.remove('open'); mobileBackdrop.classList.remove('open'); }
navBurger.addEventListener('click', ()=>{
  mobileMenu.classList.toggle('open');
  mobileBackdrop.classList.toggle('open');
});
mobileBackdrop.addEventListener('click', closeMobileMenu);
</script>

</body>
</html>
